<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>大学生活记账本</title>
<meta name="description" content="离线可用的个人记账本：微信/支付宝账单导入、自定义分类、报销不计入统计、周/月/学期汇总。">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app" class="app" data-tab="home">

  <header class="topbar">
    <div class="topbar-title">
      <span class="logo">¥</span>
      <div>
        <h1 id="pageTitle">概览</h1>
        <p class="subtitle" id="pageSubtitle">大学生活记账本</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn ai-btn" id="btnAI" title="AI 助手" aria-label="AI 助手">✨<span class="ai-btn-t">AI</span></button>
      <button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题">◐</button>
      <button class="icon-btn" id="btnImport" title="导入账单" aria-label="导入账单">⤓</button>
    </div>
  </header>

  <main class="main">
    <section class="view" id="view-home" data-view="home"></section>
    <section class="view" id="view-list" data-view="list"></section>
    <section class="view" id="view-stats" data-view="stats"></section>
    <section class="view" id="view-settings" data-view="settings"></section>
  </main>

  <button class="fab" id="btnAdd" title="记一笔" aria-label="记一笔">＋</button>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="home"><span class="tab-ico">🏠</span><span>概览</span></button>
    <button class="tab" data-tab="list"><span class="tab-ico">📋</span><span>明细</span></button>
    <button class="tab" data-tab="stats"><span class="tab-ico">📊</span><span>统计</span></button>
    <button class="tab" data-tab="settings"><span class="tab-ico">⚙️</span><span>设置</span></button>
  </nav>
</div>

<div class="picker-root" id="pickerRoot" aria-live="polite"></div>
<div class="sheet-root" id="sheetRoot" aria-live="polite"></div>
<div class="toast-root" id="toastRoot" aria-live="polite"></div>
<input type="file" id="fileInput" accept=".csv,.txt,.json" hidden>

<script src="js/util.js"></script>
<script src="js/defaults.js"></script>
<script src="js/xlsx.js"></script>
<script src="js/db.js"></script>
<script src="js/store.js"></script>
<script src="js/importer.js"></script>
<script src="js/stats.js"></script>
<script src="js/sync.js"></script>
<script src="js/ai.js"></script>
<script src="js/holiday.js"></script>
<script src="js/report.js"></script>
<script src="js/backup.js"></script>
<script src="js/ui.js"></script>
<script src="js/datetime.js"></script>
<script src="js/app.js"></script>
</body>
</html>
